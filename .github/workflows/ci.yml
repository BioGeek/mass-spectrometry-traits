name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CPU-only feature set: everything that compiles and runs without a CUDA
# toolkit or GPU. The Burn-kernel module (gated by `burn`) is included for
# compile coverage. Its integration tests are gated separately so they
# don't run in this build.
env:
  CPU_FEATURES: std,indicatif,mem_size,mem_dbg,proptest,rayon,burn,burn-autodiff,burn-fusion

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run prek hooks
        uses: j178/prek-action@v1.0.6

  test:
    name: test
    runs-on: ubuntu-latest
    needs: prek
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets --features ${{ env.CPU_FEATURES }} --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: prek
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --features ${{ env.CPU_FEATURES }} -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: prek
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build docs
        run: cargo doc --features ${{ env.CPU_FEATURES }} --no-deps
